<div class="example-container">
    <mat-toolbar class="example-toolbar">
        <button mat-icon-button (click)="sidenav.toggle()">
            @if (!sidenav.opened) {
                <mat-icon>menu</mat-icon>
            }@else {
                <mat-icon>close</mat-icon>
            }
        </button>

        <span>BIBLIOTECA</span>

        <span class="example-spacer"></span>

        <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #menu="matMenu">
            <button mat-menu-item>
                <mat-icon>account_box</mat-icon>
                <span>My account</span>
            </button>
            <button mat-menu-item (click)="sidenav.opened = false">
                <mat-icon>exit_to_app</mat-icon>
                <span>Logout</span>
            </button>
        </mat-menu>
    </mat-toolbar>

    <mat-sidenav-container class="example-sidenav-container">
        <mat-sidenav #sidenav style="width: 250px" mode="push">

            <img src="biblioteca.png" width="128" style="margin-left: 20px">

        
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/categoria" >
                <mat-icon>category</mat-icon>
                <span>Categoria</span>
            </button>
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/libro" >
                <mat-icon>book</mat-icon>
                <span>Libro</span>
            </button>
            <mat-divider></mat-divider>            
            <button class="myButton" [routerLinkActive]="['active']" mat-menu-item (click)="sidenav.toggle()" 
                routerLink="/pages/cliente" >
                <mat-icon>person</mat-icon>
                <span>Cliente</span>
            </button>
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']"  mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/reserva-wizard">
                <mat-icon>menubook</mat-icon>
                <span>Registrar Reserva</span>
            </button>
            <mat-divider></mat-divider>
            <button class="myButton" [routerLinkActive]="['active']"  mat-menu-item (click)="sidenav.toggle()"
                routerLink="/pages/buscar-reserva">
                <mat-icon>search</mat-icon>
                <span>Buscar Reserva</span>
            </button>
            <mat-divider></mat-divider>
            
        </mat-sidenav> 

        <mat-sidenav-content>
            <router-outlet></router-outlet>
        </mat-sidenav-content>

    </mat-sidenav-container>
</div>
